# Continuous integration: lint, migrations, seed, tests, dependency audit, and image build.
# Any failing step fails the workflow.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow never writes to the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, migrate, seed, test, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: itsm
          POSTGRES_USER: itsm
          # Throwaway password for a database that exists only inside this job.
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itsm -d itsm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://itsm:ci-only-password@localhost:5432/itsm
      TEST_DATABASE_URL: postgresql+psycopg://itsm:ci-only-password@localhost:5432/itsm_test
      PGPASSWORD: ci-only-password

    steps:
      # Actions are pinned to full commit SHAs; the comment shows the release.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      # Fresh random secrets for every run. They are masked in the log and never stored.
      - name: Generate run secrets
        run: |
          jwt_secret=$(python -c "import secrets; print(secrets.token_urlsafe(48))")
          demo_password=$(python -c "import secrets; print(secrets.token_urlsafe(16))")
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$demo_password"
          echo "JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
          echo "DEMO_PASSWORD=$demo_password" >> "$GITHUB_ENV"

      - name: Create test database
        run: createdb -h localhost -U itsm itsm_test

      - name: Run migrations on an empty database
        run: |
          alembic upgrade head
          alembic current | grep "(head)"

      - name: Seed demo data twice (repeatability)
        run: |
          python -m app.seed
          python -m app.seed
          counts=$(psql -h localhost -U itsm -d itsm -tA -c "
            SELECT concat_ws(',',
              (SELECT count(*) FROM users), (SELECT count(*) FROM employees),
              (SELECT count(*) FROM assets), (SELECT count(*) FROM tickets),
              (SELECT count(*) FROM faq_articles))")
          echo "users,employees,assets,tickets,faq = $counts"
          test "$counts" = "4,30,60,80,20"

      - name: Run tests
        run: pytest -q -p no:warnings

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements-dev.txt

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build the API image
        run: docker build --tag itsm-api:ci backend

      - name: Image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id itsm-api:ci -u)" != "0"

      - name: Production Compose file is valid
        run: |
          # Sample values only, to check the file; the real .env lives on the server.
          cp .env.example .env
          sed -i 's/^SITE_DOMAIN=.*/SITE_DOMAIN=example.com/; s/^ACME_EMAIL=.*/ACME_EMAIL=ops@example.com/' .env
          docker compose -f docker-compose.prod.yml config --quiet
          rm .env

      - name: Caddyfile is valid
        run: |
          docker run --rm -e SITE_DOMAIN=example.com -e ACME_EMAIL=ops@example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Shell scripts pass shellcheck
        run: shellcheck -x scripts/*.sh infra/terraform/cloud-init.sh

  terraform:
    name: Terraform configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "^1.6"
          terraform_wrapper: false

      - name: Formatting
        run: terraform fmt -check -diff

      - name: Configuration is valid
        # No backend and no AWS credentials: this checks the code, it creates nothing.
        run: |
          terraform init -backend=false -input=false
          terraform validate

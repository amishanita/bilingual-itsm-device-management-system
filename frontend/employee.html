<!doctype html>
<!-- One employee: details, devices they hold (with returns for the leaver flow), and their tickets. -->
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Tamang Amish">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:8000; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <title data-i18n="employee.title"></title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/employee.js"></script>
</head>
<body>
  <header id="topbar"></header>
  <main class="page" aria-labelledby="page-heading">
    <p class="breadcrumb"><a href="employees.html" data-i18n="employee.back"></a></p>
    <div class="page-header">
      <h1 id="page-heading" data-i18n="employee.title"></h1>
      <p id="employee-summary" class="device-summary"></p>
    </div>

    <p id="page-status" class="notice" role="status" data-i18n="common.loading"></p>
    <p id="action-message" class="notice" role="status" hidden></p>

    <div id="employee" hidden>
      <section id="leaver-panel" class="panel leaver-panel" aria-labelledby="leaver-heading" hidden>
        <h2 id="leaver-heading" data-i18n="employee.leaver"></h2>
        <p class="muted" data-i18n="employee.leaver_help"></p>
        <button id="leaver-start" class="button button-danger" type="button" data-i18n="employee.leaver_start"></button>
        <div id="leaver-confirm" class="confirm-box" hidden>
          <p id="leaver-question"></p>
          <div class="form-actions">
            <button id="leaver-yes" class="button button-danger" type="button" data-i18n="employee.leaver_confirm"></button>
            <button id="leaver-no" class="button button-quiet" type="button" data-i18n="common.cancel"></button>
          </div>
        </div>
        <p id="leaver-error" class="alert" role="alert" hidden></p>
      </section>

      <section class="panel" aria-labelledby="info-heading">
        <div class="panel-heading">
          <h2 id="info-heading" data-i18n="employee.info"></h2>
          <button id="info-edit" class="button button-quiet button-small" type="button" data-i18n="common.edit" hidden></button>
        </div>
        <dl id="info-list" class="field-list"></dl>
        <form id="info-form" novalidate hidden>
          <div id="info-fields" class="form-grid"></div>
          <p id="info-error" class="alert" role="alert" hidden></p>
          <div class="form-actions">
            <button class="button button-primary" type="submit" data-i18n="common.save"></button>
            <button id="info-cancel" class="button button-quiet" type="button" data-i18n="common.cancel"></button>
          </div>
        </form>
      </section>

      <section class="panel" aria-labelledby="devices-heading">
        <h2 id="devices-heading" data-i18n="employee.devices"></h2>
        <p id="devices-empty" class="muted" data-i18n="employee.devices_empty" hidden></p>
        <p id="devices-error" class="alert" role="alert" hidden></p>
        <div class="table-wrap">
          <table class="data-table" id="devices-table">
            <thead><tr>
              <th scope="col" data-i18n="field.asset_tag"></th>
              <th scope="col" data-i18n="field.type"></th>
              <th scope="col" data-i18n="field.model"></th>
              <th scope="col" data-i18n="field.status"></th>
              <th scope="col" data-i18n="loan.due_at"></th>
              <th scope="col"><span class="visually-hidden" data-i18n="kitting.actions"></span></th>
            </tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="panel" aria-labelledby="tickets-heading">
        <h2 id="tickets-heading" data-i18n="employee.tickets"></h2>
        <p id="tickets-empty" class="muted" data-i18n="employee.tickets_empty" hidden></p>
        <div class="table-wrap">
          <table class="data-table" id="tickets-table">
            <thead><tr>
              <th scope="col" data-i18n="ticket.number"></th>
              <th scope="col" data-i18n="ticket.title"></th>
              <th scope="col" data-i18n="field.status"></th>
              <th scope="col" data-i18n="ticket.priority"></th>
              <th scope="col" data-i18n="field.created_at"></th>
            </tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
  <noscript>JavaScript is required. / JavaScriptを有効にしてください。</noscript>
</body>
</html>

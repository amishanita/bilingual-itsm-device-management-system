<!doctype html>
<!-- Login accounts (super_admin only): list, create, change role, activate or deactivate, link to employee. -->
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Tamang Amish">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:8000; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <title data-i18n="users.title"></title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/users.js"></script>
</head>
<body>
  <header id="topbar"></header>
  <main class="page" aria-labelledby="page-heading">
    <div class="page-header page-header-actions">
      <h1 id="page-heading" data-i18n="users.title"></h1>
      <button id="add-toggle" class="button button-primary" type="button" aria-expanded="false"
              aria-controls="add-panel" data-i18n="users.add" hidden></button>
    </div>
    <p id="add-success" class="notice" role="status" hidden></p>

    <section id="add-panel" class="panel" aria-labelledby="add-heading" hidden>
      <h2 id="add-heading" data-i18n="users.add_heading"></h2>
      <form id="add-form" novalidate>
        <div id="add-fields" class="form-grid"></div>
        <p id="add-error" class="alert" role="alert" hidden></p>
        <div class="form-actions">
          <button class="button button-primary" type="submit" data-i18n="common.save"></button>
          <button id="add-cancel" class="button button-quiet" type="button" data-i18n="common.cancel"></button>
        </div>
      </form>
    </section>

    <section id="edit-panel" class="panel" aria-labelledby="edit-heading" hidden>
      <h2 id="edit-heading"></h2>
      <form id="edit-form" novalidate>
        <div id="edit-fields" class="form-grid"></div>
        <p id="edit-error" class="alert" role="alert" hidden></p>
        <div class="form-actions">
          <button class="button button-primary" type="submit" data-i18n="common.save"></button>
          <button id="edit-cancel" class="button button-quiet" type="button" data-i18n="common.cancel"></button>
        </div>
      </form>
    </section>

    <form id="filters" class="panel filters filters-3" role="search" data-i18n-aria-label="users.filters">
      <div class="filter-search">
        <label for="filter-q" data-i18n="common.search"></label>
        <input id="filter-q" name="q" type="search" maxlength="100" data-i18n-placeholder="users.search_placeholder">
      </div>
      <div>
        <label for="filter-role" data-i18n="field.role"></label>
        <select id="filter-role" name="role"></select>
      </div>
      <div class="filter-actions">
        <button id="filter-reset" class="button button-quiet" type="button" data-i18n="devices.reset"></button>
      </div>
    </form>

    <p id="page-status" class="notice" role="status" data-i18n="common.loading"></p>

    <section id="results" class="panel" aria-labelledby="results-heading" hidden>
      <h2 id="results-heading" class="visually-hidden" data-i18n="users.results"></h2>
      <p id="result-count" class="muted" aria-live="polite"></p>
      <div class="table-wrap">
        <table class="data-table" id="user-table">
          <thead><tr>
            <th scope="col" data-i18n="field.email"></th>
            <th scope="col" data-i18n="field.role"></th>
            <th scope="col" data-i18n="field.employee"></th>
            <th scope="col" data-i18n="field.language"></th>
            <th scope="col" data-i18n="field.account_status"></th>
            <th scope="col"><span class="visually-hidden" data-i18n="kitting.actions"></span></th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <p id="no-results" class="muted" data-i18n="users.no_results" hidden></p>
      <nav class="pager" data-i18n-aria-label="common.pagination">
        <button id="page-prev" class="button button-quiet" type="button" data-i18n="common.prev"></button>
        <span id="page-info" class="muted"></span>
        <button id="page-next" class="button button-quiet" type="button" data-i18n="common.next"></button>
      </nav>
    </section>
  </main>
  <noscript>JavaScript is required. / JavaScriptを有効にしてください。</noscript>
</body>
</html>

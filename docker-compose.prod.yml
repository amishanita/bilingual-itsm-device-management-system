# Production stack for the server: PostgreSQL, the API, and Caddy.
# Start with: docker compose -f docker-compose.prod.yml up -d --build
#
# Only Caddy is reachable from outside (ports 80 and 443). The database and the
# API have no published ports. Two networks keep them apart:
#   edge     Caddy <-> API
#   backend  API   <-> database (internal: no route to the internet)

name: itsm

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Keep container logs from filling the disk on a small server.
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the stack the database host is the "db" service, whatever .env says.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FRONTEND_ORIGIN: https://${SITE_DOMAIN:?set SITE_DOMAIN in .env}
      # Trust X-Forwarded-For only from Caddy's fixed address on the edge network.
      FORWARDED_ALLOW_IPS: 172.30.0.10
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      edge:
        ipv4_address: 172.30.0.10
    logging: *logging

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  backend:
    internal: true

volumes:
  pgdata:
  # Certificates live here; losing this volume means re-issuing them.
  caddy_data:
  caddy_config:

# Tool configuration for the backend (Ruff and pytest).

[project]
name = "itsm-backend"
version = "0.1.0"
description = "Bilingual ITSM Device Management System API"
authors = [{ name = "Tamang Amish" }]
requires-python = ">=3.12,<3.13"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "ANN"]
# Tests: assert is the normal pytest style, and test passwords are fixtures, not secrets.
# Generated migrations keep long SQL CHECK expressions on one line.
per-file-ignores = { "tests/**" = ["S101", "S105", "S106"], "alembic/versions/**" = ["E501"], "app/faq_seed.py" = ["E501"] }

# The local alembic/ folder would otherwise make Ruff treat the package as first-party.
[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
